<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{ disease }} | Crop Leaf Disease Identifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="dashboard-shell information-page">
      <header class="topbar">
        <div class="brand-group"><div class="brand-mark">🌾</div><div><span class="eyebrow" data-i18n="appEyebrow">Agriculture AI Assistant</span><h1 id="diseaseTitle" data-disease="{{ disease }}">{{ disease }}</h1></div></div>
        <div class="topbar-actions"><label class="language-switcher" aria-label="Language"><span>🌐</span><select id="languageSwitcher"><option value="te">తెలుగు</option><option value="hi">हिन्दी</option><option value="en">English</option></select></label><a class="text-link" href="{{ url_for('diseases') }}" data-i18n="allDiseases">All diseases</a></div>
      </header>
      <section class="panel detail-panel">
        <span class="detail-kicker" data-i18n="fieldResponse">Recommended field response</span>
        <h2 id="diseaseHeading" data-disease="{{ disease }}">{{ disease }}</h2>
        <p id="treatmentDetail">{{ treatment }}</p>
        <a class="primary-link" href="{{ url_for('home') }}" data-i18n="scanAnother">Scan another leaf</a>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script><script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
      const language = I18n.savedLanguage() || 'en'; I18n.init(language); I18n.apply(); document.getElementById('languageSwitcher').value = language;
      function localizeDisease() { document.getElementById('diseaseTitle').textContent = I18n.disease(document.getElementById('diseaseTitle').dataset.disease); document.getElementById('diseaseHeading').textContent = I18n.disease(document.getElementById('diseaseHeading').dataset.disease); }
      const originalTreatment = {{ details.management|tojson }}; localizeDisease(); if (language !== 'en') document.getElementById('treatmentDetail').textContent = I18n.text('reviewExpert'); document.getElementById('languageSwitcher').addEventListener('change', (event) => { I18n.setLanguage(event.target.value); I18n.apply(); localizeDisease(); document.getElementById('treatmentDetail').textContent = event.target.value === 'en' ? originalTreatment : I18n.text('reviewExpert'); });
    </script>
  </body>
</html>
