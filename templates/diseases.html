<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crop Leaf Disease Identifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="dashboard-shell information-page">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">🌾</div>
          <div><span class="eyebrow" data-i18n="appEyebrow">Agriculture AI Assistant</span><h1 data-i18n="information">Disease information</h1></div>
        </div>
        <div class="topbar-actions"><label class="language-switcher" aria-label="Language"><span>🌐</span><select id="languageSwitcher"><option value="te">తెలుగు</option><option value="hi">हिन्दी</option><option value="en">English</option></select></label><a class="text-link" href="{{ url_for('home') }}" data-i18n="backScanner">Back to scanner</a></div>
      </header>
      <section class="info-grid">
        {% for disease in diseases %}
        <a class="info-card" href="{{ url_for('disease_information', disease_name=disease|replace(' ', '-')) }}">
          <h2>{{ disease }}</h2>
          <p>{{ guide.get(disease, {}).get('management', 'Review the diagnosis with an agricultural expert.') }}</p>
        </a>
        {% endfor %}
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script><script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
      const language = I18n.savedLanguage() || 'en'; I18n.init(language); I18n.apply(); document.getElementById('languageSwitcher').value = language;
      document.getElementById('languageSwitcher').addEventListener('change', (event) => { I18n.setLanguage(event.target.value); I18n.apply(); document.querySelectorAll('.info-card h2').forEach((heading) => { heading.textContent = I18n.disease(heading.dataset.disease); }); });
      document.querySelectorAll('.info-card h2').forEach((heading) => { heading.dataset.disease = heading.textContent; heading.textContent = I18n.disease(heading.textContent); });
      document.querySelectorAll('.info-card p').forEach((summary) => { if (language !== 'en') summary.textContent = I18n.text('reviewExpert'); });
    </script>
  </body>
</html>
